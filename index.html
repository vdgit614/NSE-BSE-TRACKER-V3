<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="NSE/BSE Tracker Pro V3 - Sector wise stock portfolio tracker.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
    <title>NSE BSE TRACKER PRO V3</title>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>

<style>
:root {
    --bg: #0f0f0f; --text: #fff; --card-bg: #1c1c1e; --border: #333;
    --input-bg: #1e1e1e; --btn-bg: #00e676; --btn-text: #000; --muted: #aaa; --sector-header: #2c2c2e;
}
body.light-theme {
    --bg: #f4f6f8; --text: #111; --card-bg: #fff; --border: #e0e0e0;
    --input-bg: #f9f9f9; --btn-bg: #29b6f6; --btn-text: #fff; --muted: #666; --sector-header: #e5e5ea;
}
body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; padding: 15px; max-width: 550px; margin: 0 auto; transition: background 0.3s, color 0.3s; overflow-x: hidden; }

/* Header & Menu */
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.header-left { display: flex; align-items: center; gap: 10px; }
.menu-icon { font-size: 22px; cursor: pointer; padding: 5px; }
h2 { margin: 0; font-size: 1.2em; display: flex; align-items: center; gap: 6px; }

/* Sidebar Menu */
.sidebar { position: fixed; top: 0; left: -260px; width: 250px; height: 100vh; background: var(--card-bg); z-index: 2000; transition: left 0.3s ease; box-shadow: 2px 0 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
.sidebar.open { left: 0; }
.sidebar-header { padding: 20px; font-size: 18px; font-weight: bold; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.close-menu { cursor: pointer; color: #ff5252; font-size: 20px; }
.menu-item { padding: 15px 20px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 15px; }
.menu-item:hover { background: var(--input-bg); }
.overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 1999; display: none; }
.overlay.open { display: block; }

/* Indices */
.indices-container { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
.index-card { flex: 1; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; min-width: 140px; }
.index-card .sym { font-weight: bold; color: #fff; }
.green-text { color: #00e676 !important; font-weight: bold; }
.red-text { color: #ff5252 !important; font-weight: bold; }

/* Input Group */
.input-group { display: flex; gap: 5px; margin-bottom: 10px; position: relative; width: 100%; box-sizing: border-box; align-items: center; }
input[type="text"] { flex: 1; min-width: 0; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); outline: none; }
.btn { padding: 10px 12px; border-radius: 8px; border: 0; background: var(--btn-bg); color: var(--btn-text); font-weight: bold; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.camera-btn { background: #333; color: #fff; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-size: 16px; flex-shrink: 0; }

/* Controls Row */
.controls-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-left: 5px; }
.exchange-toggle { display: flex; gap: 15px; font-size: 12px; color: var(--muted); }
.exchange-toggle label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
.auto-refresh-box { font-size: 12px; color: var(--text); display: flex; align-items: center; gap: 5px; cursor: pointer; font-weight:bold; background: var(--card-bg); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); }

/* Suggestions */
.suggestions-box { position: absolute; top: 100%; left: 0; right: 0; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; max-height: 180px; overflow-y: auto; z-index: 1000; display: none; margin-top: 5px; }
.suggestion-item { padding: 10px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 13px; color: var(--text); }

/* Card UI */
.sector-header { background: var(--sector-header); padding: 8px 12px; border-radius: 6px; font-size: 14px; font-weight: bold; margin: 20px 0 10px 0; color: var(--text); border-left: 4px solid var(--btn-bg); }
.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.sym { font-size: 1.2em; font-weight: bold; display:flex; align-items:center; gap:6px; color: #fff !important; }
.exc-badge { font-size: 9px; padding: 2px 5px; border-radius: 4px; background: #444; color: #fff; }
.current-price { font-size: 1.6em; font-weight: bold; margin-top: 5px; }
.price-change { font-size: 14px; font-weight: bold; margin-bottom: 15px; }

/* 52W Horizontal Details */
.high-low-details { font-size: 12px; margin-bottom: 15px; color: var(--muted); line-height: 1.6; }

.actions { display: flex; gap: 8px; }
.del-btn, .refresh-btn { border: none; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; }
.del-btn { background: #ff525222; color: #ff5252; }
.refresh-btn { background: #29b6f622; color: #29b6f6; }

/* History & Links */
.hist-filters { display: flex; gap: 5px; justify-content: space-between; margin-bottom: 5px; }
.filter-btn { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 5px; border-radius: 6px; font-size: 11px; cursor: pointer; flex: 1; }
.filter-btn.active { background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-bg); font-weight: bold; }
.history-box { max-height: 150px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; background: var(--input-bg); margin-bottom: 15px; }
.hist-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.hist-row:last-child { border-bottom: none; }

.research-links { display: flex; gap: 6px; border-top: 1px dashed var(--border); padding-top: 15px; margin-bottom: 15px; flex-wrap: wrap; }
.r-link { text-decoration: none; font-size: 11px; font-weight: bold; padding: 8px; border-radius: 6px; color: #fff !important; text-align: center; flex: 1; min-width: 60px; }
.r-yahoo { background: #720e9e; }
.r-google { background: #4285F4; }
.r-screener { background: #263238; }

.news-box { padding: 10px; background: var(--input-bg); border-radius: 8px; border: 1px solid var(--border); }
.news-title { font-size: 12px; font-weight: bold; margin-bottom: 8px; color: var(--muted); }
.news-item { font-size: 12px; margin-bottom: 4px; display: flex; gap: 6px; align-items: flex-start; }

/* Table View */
.table-container { width: 100%; overflow-x: auto; background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 8px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { background: var(--input-bg); color: var(--muted); }

/* Login (Fixed text) */
.full-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
.auth-input-container { position: relative; width: 80%; max-width: 300px; margin: 5px auto 10px auto; }
.auth-input { width: 100%; padding: 10px 15px; border-radius: 20px; border: 1px solid var(--border); background-color: var(--input-bg); color: var(--text); font-size: 14px; outline: none; box-sizing: border-box; }
.toggle-pwd { position: absolute; right: 12px; top: 8px; cursor: pointer; font-size: 16px; }
.auth-btn { margin: 5px; padding: 10px; width: 80%; max-width: 300px; background-color: #4CAF50; color: white; border: none; border-radius: 20px; font-weight: bold; font-size: 14px; cursor: pointer; }
.forgot-pwd { text-align: right; width: 80%; max-width: 300px; margin: -5px auto 15px auto; font-size: 12px; color: #29b6f6; cursor: pointer; font-weight: bold; }
.error-msg { color: #ff5252; display: none; font-size: 13px; text-align: center; margin-top:10px; }
</style>
</head>
<body>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBanv14H1SWGaX2A2W9SUkx9pHJz1qCwg8", 
    authDomain: "nse-bse-tracker-9ab75.firebaseapp.com",
    projectId: "nse-bse-tracker-9ab75",
    storageBucket: "nse-bse-tracker-9ab75.firebasestorage.app",
    messagingSenderId: "192783633087",
    appId: "1:192783633087:web:3999b0d555e6227fa3540a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const errorMsg = document.getElementById("error-message");

document.getElementById("toggle-password").addEventListener("click", function() {
    let pwd = document.getElementById("password-input");
    if (pwd.type === "password") { pwd.type = "text"; this.innerText = "🙈"; } 
    else { pwd.type = "password"; this.innerText = "👁️"; }
});

document.getElementById("signup-btn").addEventListener("click", () => {
    createUserWithEmailAndPassword(auth, document.getElementById("email-input").value, document.getElementById("password-input").value)
    .catch(error => { errorMsg.innerText = error.message; errorMsg.style.display = "block"; });
});

document.getElementById("login-btn").addEventListener("click", () => {
    signInWithEmailAndPassword(auth, document.getElementById("email-input").value, document.getElementById("password-input").value)
    .catch(() => { errorMsg.innerText = "Wrong Email or Password!"; errorMsg.style.display = "block"; });
});

document.getElementById("forgot-btn").addEventListener("click", () => {
    let email = document.getElementById("email-input").value;
    if(!email) { errorMsg.innerText = "Enter email first to reset password."; errorMsg.style.display = "block"; return; }
    sendPasswordResetEmail(auth, email).then(() => {
        errorMsg.style.color = "#00e676";
        errorMsg.innerText = "Password reset link sent to your email!";
        errorMsg.style.display = "block";
    }).catch(err => { errorMsg.style.color = "#ff5252"; errorMsg.innerText = err.message; errorMsg.style.display = "block"; });
});

// Fixed Logout: Closes menu before signing out
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const closeMenu = () => { sidebar.classList.remove("open"); overlay.classList.remove("open"); }

document.getElementById("logout-btn").addEventListener("click", () => {
    closeMenu(); 
    signOut(auth);
});

onAuthStateChanged(auth, (user) => {
    document.getElementById("loading-screen").style.display = "none";
    if (user) {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("main-app").style.display = "block";
        initApp(); 
    } else {
        document.getElementById("login-screen").style.display = "flex";
        document.getElementById("main-app").style.display = "none";
    }
});

document.getElementById("open-menu").onclick = () => { sidebar.classList.add("open"); overlay.classList.add("open"); }
document.getElementById("close-menu").onclick = closeMenu;
overlay.onclick = closeMenu;

window.switchView = function(viewId) {
    document.getElementById("card-view").style.display = "none";
    document.getElementById("table-view").style.display = "none";
    document.getElementById("news-view").style.display = "none";
    document.getElementById(viewId).style.display = "block";
    closeMenu();
    if(viewId === 'table-view') populateTable();
};

let isAppReady = false;
let globalStockData = {}; 

window.fetchMarketIndices = async function() {
    const indices = [ { id: 'nifty', sym: '%5ENSEI', name: 'NIFTY' }, { id: 'sensex', sym: '%5EBSESN', name: 'SENSEX' } ];
    for (let idx of indices) {
        try {
            let res = await fetch("https://dry-king-2d0b.vasimbhaipainter.workers.dev/?sym=" + idx.sym);
            let data = await res.json();
            let meta = data.chart.result[0].meta;
            
            let current = meta.regularMarketPrice;
            // Fallback to chartPreviousClose if previousClose is missing
            let prev = (meta.previousClose !== undefined && meta.previousClose !== null) ? meta.previousClose : meta.chartPreviousClose;
            let diff = current - prev;
            
            let color = diff >= 0 ? 'green-text' : 'red-text';
            let arrow = diff >= 0 ? '▲' : '▼';
            
            let formattedCurrent = current.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            let diffFormatted = Math.abs(diff).toFixed(2);
            
            document.getElementById(`${idx.id}-card`).innerHTML = `<span class="sym">${idx.name}</span> <span class="${color}">${formattedCurrent}</span> <span class="${color}">${arrow} ${diffFormatted}</span>`;
        } catch(e) {
            document.getElementById(`${idx.id}-card`).innerHTML = `<span class="sym">${idx.name}</span> <span class="red-text">Error</span>`;
        }
    }
};

function initApp() {
    if(isAppReady) return; 
    isAppReady = true;

    const MY_SERVER_URL = "https://dry-king-2d0b.vasimbhaipainter.workers.dev/?sym=";
    const stockHistoryMap = new Map();

    window.fetchMarketIndices();

    if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-theme');
    document.getElementById("theme-btn").addEventListener("click", () => {
        document.body.classList.toggle('light-theme');
        localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
    });

    let rawStocks = JSON.parse(localStorage.getItem('nse_tracker_v3') || localStorage.getItem('nse_tracker_v2') || '["RELIANCE:NSE"]');
    let myStocks = rawStocks.map(s => s.includes(':') ? s : s + ':NSE');
    myStocks = [...new Set(myStocks)]; 

    const searchInput = document.getElementById("inp");
    const suggestionsBox = document.getElementById("suggestions");
    let searchTimeout;

    searchInput.addEventListener("input", () => {
        let val = searchInput.value.trim();
        if (val.length === 0) { suggestionsBox.style.display = "none"; return; }
        suggestionsBox.style.display = "block";
        suggestionsBox.innerHTML = '<div class="suggestion-item">Searching...</div>';
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(async () => {
            try {
                let res = await fetch(`https://query2.finance.yahoo.com/v1/finance/search?q=${val}&quotesCount=5`);
                let data = await res.json();
                suggestionsBox.innerHTML = ""; 
                if (data?.quotes?.length > 0) {
                    data.quotes.filter(q => q.symbol.includes('.NS') || q.symbol.includes('.BO')).forEach(stock => {
                        let div = document.createElement("div");
                        div.className = "suggestion-item";
                        let cleanSym = stock.symbol.split('.')[0];
                        let exc = stock.symbol.includes('.BO') ? 'BSE' : 'NSE';
                        div.innerHTML = `<b>${cleanSym}</b> (${exc}) - <span class="small">${stock.shortname || ''}</span>`;
                        div.onclick = () => { addStock(cleanSym + ":" + exc); };
                        suggestionsBox.appendChild(div);
                    });
                } else { suggestionsBox.innerHTML = '<div class="suggestion-item red-text">Not found</div>'; }
            } catch(e) { suggestionsBox.style.display = "none"; }
        }, 500);
    });

    document.addEventListener("click", (e) => { if (e.target.id !== "inp") suggestionsBox.style.display = "none"; });

    function addStock(finalSym) {
        if (!myStocks.includes(finalSym)) { myStocks.unshift(finalSym); saveAndRender(); }
        searchInput.value = ''; suggestionsBox.style.display = "none";
    }

    document.getElementById("add-btn").addEventListener("click", () => {
        let s = searchInput.value.trim().toUpperCase();
        if(s) addStock(s + ":" + document.querySelector('input[name="exchange"]:checked').value);
    });

    function saveAndRender() { localStorage.setItem('nse_tracker_v3', JSON.stringify(myStocks)); renderList(); }

    function renderList() {
        const listDiv = document.getElementById('list');
        listDiv.innerHTML = '';
        myStocks.forEach(item => {
            let [sym, exc] = item.includes(':') ? item.split(':') : [item, 'NSE'];
            let cardId = 'card-' + sym + '-' + exc;
            let card = document.createElement("div");
            card.className = "card";
            card.id = cardId;
            card.innerHTML = `<div class="card-header"><div class="sym" style="color:#fff;">${sym} <span class="exc-badge">${exc}</span></div></div><div class="small">Fetching data...</div>`;
            listDiv.appendChild(card);
            fetchLiveStockData(item);
        });
        generateGlobalNews();
    }

    let autoRefreshInterval;
    document.getElementById('auto-refresh-btn').addEventListener('change', (e) => {
        if(e.target.checked) {
            autoRefreshInterval = setInterval(() => { window.fetchMarketIndices(); renderList(); }, 60000);
        } else {
            clearInterval(autoRefreshInterval);
        }
    });

    window.generateGlobalNews = function() {
        let newsContainer = document.getElementById("global-news-container");
        newsContainer.innerHTML = "";
        myStocks.slice(0, 10).forEach(item => {
            let sym = item.split(':')[0];
            let isPositive = Math.random() > 0.5;
            let text = isPositive ? `Strong volume breakout expected for ${sym}.` : `Global pressure testing support levels for ${sym}.`;
            let icon = isPositive ? '🟢' : '🔴';
            newsContainer.innerHTML += `<div class="news-box" style="margin-bottom:10px;"><b>${sym}</b><div class="news-item">${icon} ${text}</div></div>`;
        });
    }

    // Dynamic Colors applied to Table View Fix
    window.populateTable = function() {
        const tbody = document.getElementById("table-body");
        tbody.innerHTML = "";
        myStocks.forEach(item => {
            let data = globalStockData[item];
            if(!data) return;
            let colorCls = data.diff >= 0 ? 'green-text' : 'red-text';
            let tr = document.createElement("tr");
            tr.innerHTML = `
                <td><b style="color:#fff;">${data.sym}</b></td>
                <td><b class="${colorCls}">₹${data.price}</b></td>
                <td class="${colorCls}">${data.diff >= 0 ? '▲':'▼'} ${Math.abs(data.diff).toFixed(2)}</td>
                <td class="green-text">₹${data.high}</td>
                <td class="red-text">₹${data.low}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function fetchLiveStockData(item) {
        let [sym, exc] = item.includes(':') ? item.split(':') : [item, 'NSE'];
        let cardId = 'card-' + sym + '-' + exc;
        let card = document.getElementById(cardId);
        if(!card) return;
        
        try {
            let querySym = exc === 'BSE' ? sym + '.BO' : sym + '.NS';
            
            let res = await fetch(MY_SERVER_URL + querySym + "&range=1y");
            let data = await res.json();
            
            let result = data.chart.result[0];
            let meta = result.meta;
            let closes = result.indicators?.quote?.[0]?.close || [];
            let timestamps = result.timestamp || [];
            
            let maxPrice = 0, minPrice = Infinity;
            let maxDate = "--", minDate = "--";
            
            let historyArr = [];
            for(let i = 1; i < timestamps.length; i++) {
                let c = closes[i];
                if(c === null) continue;
                
                if(c > maxPrice) { maxPrice = c; maxDate = new Date(timestamps[i]*1000).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}); }
                if(c < minPrice) { minPrice = c; minDate = new Date(timestamps[i]*1000).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}); }
                
                let dateStr = new Date(timestamps[i]*1000).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
                let color = c >= closes[i-1] ? 'green-text' : 'red-text';
                let icon = c >= closes[i-1] ? '▲' : '▼';
                historyArr.push({ time: timestamps[i], html: `<div class="hist-row"><span>${dateStr}</span><span class="${color}">${icon} ₹${c.toFixed(2)}</span></div>` });
            }
            historyArr.sort((a,b) => b.time - a.time);
            stockHistoryMap.set(item, historyArr);
            
            if(maxPrice === 0) maxPrice = meta.regularMarketDayHigh || meta.regularMarketPrice;
            if(minPrice === Infinity) minPrice = meta.regularMarketDayLow || meta.regularMarketPrice;

            let current = meta.regularMarketPrice;
            // Fixed NaN Issue logic: Fallback to chartPreviousClose
            let prev = (meta.previousClose !== undefined && meta.previousClose !== null) ? meta.previousClose : meta.chartPreviousClose;
            
            let diff = current - prev;
            let pChange = (diff / prev) * 100;
            
            let isPos = diff >= 0;
            let colorCls = isPos ? 'green-text' : 'red-text';
            let sign = isPos ? '+' : '';
            let arrow = isPos ? '▲' : '▼';
            
            globalStockData[item] = { sym, price: current.toFixed(2), diff: diff.toFixed(2), high: maxPrice.toFixed(2), low: minPrice.toFixed(2) };

            card.innerHTML = `
                <div class="card-header">
                    <div class="sym" style="color:#fff;">${sym} <span class="exc-badge" style="background:${exc==='BSE'?'#1976D2':'#388E3C'}">${exc}</span></div>
                    <div class="actions"><button class="refresh-btn" data-item="${item}">↻</button><button class="del-btn" data-item="${item}">Del</button></div>
                </div>
                
                <!-- DYNAMIC PRICE COLOR (Fixed) -->
                <div class="current-price ${colorCls}">₹${current.toFixed(2)}</div>
                <div class="price-change ${colorCls}">${arrow} ${sign}${diff.toFixed(2)} (${sign}${pChange.toFixed(2)}%)</div>
                
                <!-- 52W HORIZONTAL DETAILS WITH YEAR -->
                <div class="high-low-details">
                    <div style="margin-bottom: 4px;">52W High: <b class="green-text">₹${maxPrice.toFixed(2)}</b> (${maxDate})</div>
                    <div>52W Low: <b class="red-text">₹${minPrice.toFixed(2)}</b> (${minDate})</div>
                </div>
                
                <!-- HISTORY FILTERS -->
                <div class="hist-filters">
                    <button class="filter-btn active" data-action="filter" data-item="${item}" data-days="7">7D</button>
                    <button class="filter-btn" data-action="filter" data-item="${item}" data-days="30">1M</button>
                    <button class="filter-btn" data-action="filter" data-item="${item}" data-days="90">3M</button>
                    <button class="filter-btn" data-action="filter" data-item="${item}" data-days="180">6M</button>
                    <button class="filter-btn" data-action="filter" data-item="${item}" data-days="365">1Y</button>
                </div>
                <div class="history-box" id="hist-box-${sym}-${exc}">${historyArr.slice(0,7).map(h=>h.html).join('')}</div>
                
                <!-- LINKS (NSE Added) & NEWS -->
                <div class="research-links">
                    <a href="https://www.nseindia.com/get-quotes/equity?symbol=${sym}" target="_blank" class="r-link" style="background:#f37021;">NSE</a>
                    <a href="https://finance.yahoo.com/quote/${querySym}" target="_blank" class="r-link r-yahoo">Yahoo</a>
                    <a href="https://www.google.com/finance/quote/${sym}:${exc}" target="_blank" class="r-link r-google">Google</a>
                    <a href="https://www.screener.in/company/${sym}/consolidated/" target="_blank" class="r-link r-screener">Screener</a>
                </div>
                <div class="news-box"><div class="news-title">Flash News</div><div class="news-item">${isPos ? '🟢 Uptrend momentum building.' : '🔴 Facing resistance level.'}</div></div>
            `;
        } catch(e) {
            card.innerHTML = `<div class="card-header"><b class="sym" style="color:#fff;">${sym} <span class="exc-badge">${exc}</span></b> <button class="del-btn" data-item="${item}">Del</button></div><div class="red-text small">Data unavailable.</div>`;
        }
    }

    document.getElementById('list').addEventListener('click', (e) => {
        const target = e.target;
        if(target.classList.contains('del-btn')) {
            if(confirm(`Remove ${target.dataset.item}?`)) { myStocks = myStocks.filter(s => s !== target.dataset.item); saveAndRender(); }
        } else if(target.classList.contains('refresh-btn')) {
            fetchLiveStockData(target.dataset.item);
        } else if(target.dataset.action === 'filter') {
            const item = target.dataset.item;
            const days = parseInt(target.dataset.days);
            target.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            target.classList.add('active');
            let [sym, exc] = item.split(':');
            const box = document.getElementById(`hist-box-${sym}-${exc}`);
            if(box) box.innerHTML = (stockHistoryMap.get(item)||[]).slice(0, days).map(h => h.html).join('');
        }
    });

    renderList();
}
</script>
</body>
</html>
